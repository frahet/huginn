name: test

on:
  push:
    paths:
      - 'gbrain/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        working-directory: gbrain
      - run: bun test
        working-directory: gbrain
